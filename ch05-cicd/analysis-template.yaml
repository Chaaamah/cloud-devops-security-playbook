# Success rate measured from the application's own metrics (as in the book).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: payments
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 1m
      count: 5
      successCondition: result[0] >= 0.99
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",code!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
---
# The same check for apps without their own metrics, using ingress-nginx's
# request metrics instead (used in lab 2).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-ingress
  namespace: payments
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 1m
      count: 5
      successCondition: len(result) == 0 || result[0] >= 0.99   # no traffic yet counts as healthy
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            sum(rate(nginx_ingress_controller_requests{service="{{args.service-name}}",status!~"5.."}[2m]))
            /
            sum(rate(nginx_ingress_controller_requests{service="{{args.service-name}}"}[2m]))
