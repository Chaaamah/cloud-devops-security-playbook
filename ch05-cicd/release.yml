# Copy to .github/workflows/release.yml in the application repository.
# Build once, scan, sign, then promote the same digest through GitOps.
# Pin each action to a full commit SHA before production use (section 5.5).
name: release
on:
  push:
    branches: [main]

permissions:
  contents: read                  # least privilege by default

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write             # keyless signing with Sigstore
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - uses: anchore/scan-action@v5
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high

      - uses: sigstore/cosign-installer@v3

      - name: Sign image and attach SBOM attestation
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@${{ steps.push.outputs.digest }}"

  promote-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging          # protected environment with its own rules
    steps:
      - name: Update the staging image digest in the GitOps repository
        run: |
          echo "Commit ${{ needs.build.outputs.digest }} to apps/checkout/overlays/staging"
          # Typically: clone the GitOps repo with a narrowly scoped token or GitHub App,
          # run `kustomize edit set image ...@${DIGEST}`, commit, push. Argo CD does the rest.
