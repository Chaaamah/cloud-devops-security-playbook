# Custom Falco rules. The macros "outbound" and "container" come from Falco's default rules.
- list: metadata_allowed_namespaces
  items: [kube-system, monitoring]

- rule: Container contacts cloud metadata service
  desc: >
    A container outside the allow-listed namespaces connected to the instance
    metadata endpoint, a common step to steal node credentials.
  condition: >
    outbound and container
    and fd.sip = "169.254.169.254"
    and not k8s.ns.name in (metadata_allowed_namespaces)
  output: >
    Metadata service contacted from container
    (pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository cmd=%proc.cmdline)
  priority: WARNING
  tags: [cloud, credential_access, T1552.005]
