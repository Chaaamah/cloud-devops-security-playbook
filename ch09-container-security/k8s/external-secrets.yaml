# The store authenticates with the External Secrets controller's own identity
# (EKS Pod Identity or IRSA), so no AWS key is stored in the cluster.
apiVersion: external-secrets.io/v1      # v1beta1 on releases before 0.17
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: checkout-db
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: checkout-db
  data:
    - secretKey: password
      remoteRef:
        key: prod/checkout/db
        property: password
