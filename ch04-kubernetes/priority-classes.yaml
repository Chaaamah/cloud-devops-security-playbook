apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: business-critical
value: 100000
globalDefault: false
description: "Customer-facing services that must keep running under pressure."
---
# Placeholder pods hold spare capacity and are evicted first when real pods need room.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: overprovisioning
value: -10
globalDefault: false
preemptionPolicy: Never
description: "Capacity buffer; always evicted before anything else."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-buffer
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: capacity-buffer }
  template:
    metadata:
      labels: { app: capacity-buffer }
    spec:
      priorityClassName: overprovisioning
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: "1", memory: 1Gi }
